services:
  api:
    build: .
    environment:
      AUTO_RETRAIN: "1"
      RETRAIN_THRESHOLD: "15"
      MIN_RETRAIN_SAMPLES: "6"
    volumes:
      - ./models:/app/models
      - ./runtime:/app/runtime
      - ./data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

# Scale the model with: docker compose up -d --scale api=3
# Locust should call http://localhost:8000 so nginx can spread the requests.
